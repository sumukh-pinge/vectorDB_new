apiVersion: batch/v1
kind: Job
metadata:
  name: vdb-ls-dpr-w100-minilm-n4096-index
  namespace: designlab
  labels:
    app: "vectordb-large-scale"
    dataset: "dpr-w100"
    encoder: "minilm"
    stage: "index"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: "vectordb-large-scale"
        dataset: "dpr-w100"
        encoder: "minilm"
        stage: "index"
    spec:
      restartPolicy: Never
      containers:
      - name: run
        image: spinge/vectordb-new:20260304
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/nrp-launch"]
        args:
          - "python"
          - "run_large_scale_retrieval.py"
          - "--stage"
          - "build-index"
          - "--dataset"
          - "dpr-w100"
          - "--encoder"
          - "all-MiniLM-L6-v2"
          - "--nlist"
          - "4096"
          - "--faiss_threads"
          - "4"
        env:
          - name: GIT_REPO
            value: "https://github.com/sumukh-pinge/vectorDB_new.git"
          - name: GIT_REF
            value: "main"
          - name: HF_HOME
            value: "/mnt/work/hf_cache"
          - name: TRANSFORMERS_CACHE
            value: "/mnt/work/hf_cache"
          - name: DATA_ROOT
            value: "/mnt/work/VectorDB_MICRO/datasets/semantic"
          - name: INTERMEDIATE_ROOT
            value: "/mnt/work/VectorDB_MICRO/intermediate_data"
          - name: INDEX_ROOT
            value: "/mnt/work/VectorDB_MICRO/large_scale_indices/large_scale_minilm_20260607"
          - name: RUN_ROOT
            value: "/mnt/work/VectorDB_MICRO/large_scale_runs/large_scale_minilm_20260607"
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: OMP_NUM_THREADS
            value: "4"
          - name: MKL_NUM_THREADS
            value: "4"
        resources:
          requests:
            nvidia.com/gpu: 0
            cpu: "4"
            memory: "384Gi"
          limits:
            nvidia.com/gpu: 0
            cpu: "4"
            memory: "448Gi"
        volumeMounts:
          - name: work
            mountPath: /mnt/work
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: sumukh-4tb
---
apiVersion: batch/v1
kind: Job
