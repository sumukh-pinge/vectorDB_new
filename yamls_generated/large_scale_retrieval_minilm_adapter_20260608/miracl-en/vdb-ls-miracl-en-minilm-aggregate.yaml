apiVersion: batch/v1
kind: Job
metadata:
  name: vdb-ls-miracl-en-minilm-aggregate
  namespace: designlab
  labels:
    app: "vectordb-large-scale"
    dataset: "miracl-en"
    encoder: "minilm"
    stage: "aggregate"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: "vectordb-large-scale"
        dataset: "miracl-en"
        encoder: "minilm"
        stage: "aggregate"
    spec:
      restartPolicy: Never

      initContainers:
      - name: wait-for-markers
        image: busybox:1.36
        command: ["sh", "-c", "until [ -f /mnt/work/VectorDB_MICRO/large_scale_runs/large_scale_minilm_adapter_20260608/miracl-en/all-MiniLM-L6-v2/nlist8192/np1024/dts242/adapter_on/summary.json ]; do echo waiting for /mnt/work/VectorDB_MICRO/large_scale_runs/large_scale_minilm_adapter_20260608/miracl-en/all-MiniLM-L6-v2/nlist8192/np1024/dts242/adapter_on/summary.json; sleep 60; done"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
          - name: work
            mountPath: /mnt/work
      containers:
      - name: run
        image: spinge/vectordb-new:20260304
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/nrp-launch"]
        args:
          - "python"
          - "aggregate_large_scale_retrieval.py"
          - "--dataset"
          - "miracl-en"
          - "--encoder"
          - "all-MiniLM-L6-v2"
          - "--nlist"
          - "8192"
          - "--nprobes"
          - "128,256,512,1024"
          - "--modes"
          - "ivf,dts111,dts242"
          - "--adapters"
          - "off,on"
        env:
          - name: GIT_REPO
            value: "https://github.com/sumukh-pinge/vectorDB_new.git"
          - name: GIT_REF
            value: "main"
          - name: HF_HOME
            value: "/mnt/work/hf_cache"
          - name: TRANSFORMERS_CACHE
            value: "/mnt/work/hf_cache"
          - name: DATA_ROOT
            value: "/mnt/work/VectorDB_MICRO/datasets/semantic"
          - name: INTERMEDIATE_ROOT
            value: "/mnt/work/VectorDB_MICRO/intermediate_data"
          - name: INDEX_ROOT
            value: "/mnt/work/VectorDB_MICRO/large_scale_indices/large_scale_minilm_adapter_20260608"
          - name: RUN_ROOT
            value: "/mnt/work/VectorDB_MICRO/large_scale_runs/large_scale_minilm_adapter_20260608"
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: OMP_NUM_THREADS
            value: "1"
          - name: MKL_NUM_THREADS
            value: "1"
        resources:
          requests:
            nvidia.com/gpu: 0
            cpu: "1"
            memory: "8Gi"
          limits:
            nvidia.com/gpu: 0
            cpu: "1"
            memory: "16Gi"
        volumeMounts:
          - name: work
            mountPath: /mnt/work
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: sumukh-4tb
