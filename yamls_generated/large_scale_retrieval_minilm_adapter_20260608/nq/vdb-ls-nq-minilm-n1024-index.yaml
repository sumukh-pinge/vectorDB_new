apiVersion: batch/v1
kind: Job
metadata:
  name: vdb-ls-nq-minilm-n1024-index
  namespace: designlab
  labels:
    app: "vectordb-large-scale"
    dataset: "nq"
    encoder: "minilm"
    stage: "index"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: "vectordb-large-scale"
        dataset: "nq"
        encoder: "minilm"
        stage: "index"
    spec:
      restartPolicy: Never
      containers:
      - name: run
        image: spinge/vectordb-new:20260304
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/nrp-launch"]
        args:
          - "python"
          - "run_large_scale_retrieval.py"
          - "--stage"
          - "build-index"
          - "--dataset"
          - "nq"
          - "--encoder"
          - "all-MiniLM-L6-v2"
          - "--qrels_split"
          - "test"
          - "--nlist"
          - "1024"
          - "--faiss_threads"
          - "1"
          - "--train_size"
          - "400000"
          - "--train_blocks"
          - "128"
        env:
          - name: GIT_REPO
            value: "https://github.com/sumukh-pinge/vectorDB_new.git"
          - name: GIT_REF
            value: "main"
          - name: HF_HOME
            value: "/mnt/work/hf_cache"
          - name: TRANSFORMERS_CACHE
            value: "/mnt/work/hf_cache"
          - name: DATA_ROOT
            value: "/mnt/work/VectorDB_MICRO/datasets/semantic"
          - name: INTERMEDIATE_ROOT
            value: "/mnt/work/VectorDB_MICRO/intermediate_data"
          - name: INDEX_ROOT
            value: "/mnt/work/VectorDB_MICRO/large_scale_indices/large_scale_minilm_adapter_20260608"
          - name: RUN_ROOT
            value: "/mnt/work/VectorDB_MICRO/large_scale_runs/large_scale_minilm_adapter_20260608"
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: OMP_NUM_THREADS
            value: "1"
          - name: MKL_NUM_THREADS
            value: "1"
        resources:
          requests:
            nvidia.com/gpu: 0
            cpu: "1"
            memory: "56Gi"
          limits:
            nvidia.com/gpu: 0
            cpu: "1"
            memory: "64Gi"
        volumeMounts:
          - name: work
            mountPath: /mnt/work
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: sumukh-4tb
